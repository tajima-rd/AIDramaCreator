  reading: ひろせ かおる
  age: 40代半ば
  characteristics:
  - item: 人物像
    description: 女性地理教師。自身もソロで世界各地をバックパックで旅した経験を持つ活動的な人物。
- id: bbee5425-12b5-53ee-bb5b-4159ebdf75c8
