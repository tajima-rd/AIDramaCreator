  name: 水野 健太
  reading: みずの けんた
  characteristics:
  - item: 人物像
    description: 堅実で、大手電機メーカーに勤務する優等生タイプ。
- id: 5ac8532c-5ba3-58dc-a305-df2e67c20d0d
  key: character_027
  name: 早川 拓海
  reading: はやかわ たくみ
  characteristics:
  - item: 人物像
    description: 冷静で計画的。
- id: 6b690bc1-4681-5694-9a2e-3449d0b270b2
  key: character_028
  name: （氏名不詳）
- id: 0208a422-4f36-5704-9998-ee085dda2894
  key: character_029
