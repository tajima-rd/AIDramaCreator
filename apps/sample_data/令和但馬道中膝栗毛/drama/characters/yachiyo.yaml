  name: 中野 詩織
  reading: なかの しおり
  characteristics:
  - item: 人物像
    description: 真面目で努力家。
- id: ace9ba3b-b36d-573a-afda-a7b884ac9837
  key: character_034
  name: 天野 遊
  reading: あまの ゆう
  age: 40代後半
  characteristics:
  - item: 人物像
    description: 男性文化人類学教授。赤髪にピアスというアヴァンギャルドな外見とは裏腹に、国内外に広いネットワークを持ち、非常に鋭い知性を持つ「キレ者」。
- id: e608a02e-056b-5888-920f-835536488981
  key: character_035
  name: 村上 玲奈
  reading: むらかみ れな
  characteristics:
  - item: 人物像
    description: 冷静で知的。現在は大学院を経て博物館学の研究者として活躍しています。
- id: dec8646d-1bb6-578f-b167-2fd57bbd95ed
  key: character_036
  name: 吉村 拓也
  reading: よしむら たくや
  characteristics:
  - item: 人物像
    description: 要領が良く、ほどほどに努力して単位を取るタイプ。
- id: 1ec2db40-c358-5cfb-9747-02275771573b
  key: character_037
  name: 田中 美咲
  reading: たなか みさき
  characteristics:
  - item: 人物像
    description: 女子学生。流行に敏感で、学業よりもサークル活動やアルバイトに熱心でした。
- id: 4cac46af-fb12-5f17-adb3-7d9c69f2cdaa
  key: character_038
  name: （氏名不詳）
  characteristics:
  - item: 人物像
    description: 優しそうに見えて優柔不断なタイプ
- id: 71e99bfb-13bd-5c4d-a405-356981b8bf38
  key: character_039
  name: （氏名不詳）
  characteristics:
  - item: 人物像
    description: |-
      単なる女好きタイプ
      見た目が非常に良く、口が達者。
- id: c3fca12c-cdaf-56c4-86b5-fb249b60fbc0
  key: character_040
  name: 大山 巌
  reading: おおやま いわお
  age: 50代後半
  characteristics:
  - item: 人物像
    description: 報道局デスク。典型的な「根性論」「精神論」を振りかざし、非効率なアナログ業務を美徳とする\*\*「昭和気質」の権化\*\*。
- id: 3d83cb3d-7d93-5dd7-a248-d1e8e28a3a4b
  key: character_041
  name: 佐々木 遥香
  reading: ささき はるか
  characteristics:
  - item: 人物像
    description: 弥千代と同じく難関大学出身。物静かだが芯が強い。
- id: 40f7d717-f797-5bfe-8a26-b8359a82c445
  key: character_042
  name: 西村 健太
  reading: にしむら けんた
  characteristics:
  - item: 人物像
    description: 大手総合商社勤務のエリートサラリーマン。世間体や安定した将来設計を重視する現実的な価値観の持ち主。
character_groups:
- id: 6acbd4ae-454f-56e1-82a2-2b9f2ed89b89
  key: character_group_005
  name: 水野家
  kind: 家族
  members:
  - {ref: character_023}
  - {ref: character_024}
