relationships:
- id: 4aa62bf3-313a-565d-a423-cea3cf139516
  key: relationship_024
  source: {ref: character_023}
  target: {ref: character_024}
  label: 父親
  description: 弥千代が難関大学に入り、大手テレビ局に就職した際は鼻高々でしたが、彼女がテレビ局を辞めてVチューバーになった際には激しく反対しました。今でも彼女の職業を完全には理解しておらず、親戚の集まりでは話題を避ける傾向があります。しかし、内心では娘のことが心配でならず、弥千代のSNSを密かにチェックしたり、テレビ局時代の同期から情報を集めたりするなど、不器用ながらも深い愛情を抱いています。
- id: 95d14c0e-4c21-5e52-a0a1-a7aa142bbcf0
  key: relationship_025
  source: {ref: character_023}
  target: {ref: character_025}
  label: 母親
  description: 弥千代の自由な発想や行動を理解しようと努める存在。夫と弥千代の間に入り、衝突を和らげる緩衝材の役割を担っています。弥千代のVlogを楽しみに見ており、友人に自慢しています。
- id: fc4a1f44-957d-52e0-9469-c0b9dd01b0e3
  key: relationship_026
  source: {ref: character_023}
  target: {ref: character_026}
  label: 弟
  description: 弥千代とは対照的な性格。姉の破天荒な生き方を尊敬しつつも呆れるなど、複雑な感情を抱いています。表立って応援することはありませんが、弥千代のVlogの熱心な視聴者であり、陰ながら姉をサポートする確かな絆があります。
- id: 284af69a-8392-58ae-b3e9-f0e7fb90965f
  key: relationship_027
  source: {ref: character_023}
  target: {ref: character_027}
  label: 幼なじみ
  period: {ref: temporal_node_007}
  description: 弥千代とは生まれた時から同じ町に住む幼なじみ。弥千代の無鉄砲ないたずらや突飛な発想に対する\*\*最初の「ツッコミ役」\*\*でした。弥千代が秘密基地を作る際は、危険がないかチェックしたり、必要な道具を揃えたりするなど、常に行動をサポートしていました。彼の存在は、弥千代が安心して自由に振る舞える基盤となりました。現在は、それぞれ別の道を歩み、連絡は途絶えていますが、互いの活躍を薄々知っているかもしれません。弥千代が**東海道中膝栗毛に登場する弥次郎兵衛の子孫であるという話を知っている友人**の一人。
- id: 5d1539f3-1daf-5c5b-bc76-800cb000dc11
  key: relationship_028
  source: {ref: character_023}
  target: {ref: character_028}
  label: 吹奏楽部の顧問
  period: {ref: temporal_node_008}
  description: 弥千代の豊かな表現力と大胆な演奏スタイルを評価し、彼女がパーカッションで頭角を現すきっかけを作りました。彼女の音楽に対する「演出」や「構成」への関心を深く理解し、その才能を伸ばすことに貢献しました。
- id: feee1390-3e52-589f-b44a-130c4c453af3
  key: relationship_029
  source: {ref: character_023}
  target: {ref: character_029}
  label: 好きな教師
  period: {ref: temporal_node_009}
  description: 地理の教師で、その生き生きとした授業は弥千代の**知的好奇心と旅への衝動を強く刺激**しました。弥千代の型破りな探求心に期待を寄せ、時には放課後に世界地図を広げて議論するなど、弥千代の知的な成長を促した恩師です。
- id: 2303d321-ff06-5766-a8fe-f770289e28be
  key: relationship_030
  source: {ref: character_023}
  target: {ref: character_030}
  label: 嫌いな教師
  period: {ref: temporal_node_009}
  description: 体育教師。弥千代は彼の非合理的な指示や、生徒の主体性を認めない指導方法に反発心を抱き、これが**後の「理不尽な権威」への嫌悪感と反骨精神**を育む一因となりました。
- id: 8d54c95b-9cb0-553c-b87b-0d9adca51300
  key: relationship_031
  source: {ref: character_023}
  target: {ref: character_031}
  label: 片思いの先輩
  period: {ref: temporal_node_009}
  description: 弥千代の1学年上。全校集会での弥千代の放送部としての発表や、文化祭での企画を見て、彼女の**枠にとらわれない発想力と表現力に密かに憧れ**を抱いていました。弥千代が恋愛に興味がないことを察し、想いを打ち明けることなく見守るに留めました。
- id: 99f06dbd-3b4c-5769-b36c-9c0d79d79ba6
  key: relationship_032
  source: {ref: character_023}
  target: {ref: character_032}
  label: 同級生
  period: {ref: temporal_node_009}
  description: 同じクラス。弥千代の突飛な発言や放送部の活動を「面白いヤツ」と面白がってはいましたが、深く関わることはありませんでした。彼女の知的好奇心と行動力には一目置いていました。
- id: f2466bdf-f417-597c-8b79-7a42ccb66756
  key: relationship_033
  source: {ref: character_023}
  target: {ref: character_033}
  label: 同級生
  period: {ref: temporal_node_009}
  description: 同じ放送部に所属。弥千代の企画力や発想力を尊敬していました。弥千代が作り出す番組や企画の**具体的な制作面で、縁の下の力持ちとして弥千代を支えた存在**です。
- id: 6a97e44a-892e-556d-8273-9aa3322431a6
  key: relationship_034
  source: {ref: character_023}
  target: {ref: character_034}
  label: 指導教員
  period: {ref: temporal_node_010}
  description: 弥千代の**自由な発想力と既成概念にとらわれない行動力**に早くから目をつけ、彼女の「異端児」ぶりを評価していました。弥千代の無謀なフィールドワーク計画に対し、直接的な言葉はかけず「いいじゃん！」とだけ言い、**見えないところで必要な情報や安全のアドバイスを密かに与える**など、弥千代の探求をサポートしました。彼の存在は、弥千代が自分の道を信じて進む大きな支えとなりました。思い切って、先祖が東海道中膝栗毛に登場する弥次郎兵衛の子孫であるという話をしたところ、目を輝かせながら、先祖がどこに住んでいたのか？苗字はいつから水野になったのか？など質問攻めにあいます。弥千代の話を疑うことなく、嬉しそうに、一人で思考が暴走…そんな教授に安心感を覚えつつ、「やっぱり、変な先生…」と思いました。
- id: fa0d22fa-ad2c-5576-9eef-e6441fe67659
  key: relationship_035
  source: {ref: character_023}
  target: {ref: character_035}
  label: 親友
  period: {ref: temporal_node_010}
  description: 弥千代と同じ文化人類学ゼミに所属。弥千代の突飛な行動に驚きつつも、常に興味を持って見守る理解者。弥千代が危険なフィールドワークから帰ってくるたびに、その話を聞き、論文作成を手伝うなど、**陰ながら弥千代をサポートした唯一無二の存在**です。弥千代がテレビ局ではなく自分の道を模索し始めた時も、理解を示し、背中を押しました。弥千代が弥次郎兵衛の子孫という話を知る友人の一人。信じていないものの、嘘とも言い切れない部分もあります。弥千代がこの話をすると「ネタ？本気？」と、やや困惑してしまいます。本気で調べるべきか、時々、真剣に悩むことがあります。
- id: dc3fcdd5-699f-5577-9973-3ad12f19b4f1
  key: relationship_036
  source: {ref: character_023}
  target: {ref: character_036}
  label: 友人
  period: {ref: temporal_node_010}
  description: ゼミの課題で何度かグループを組んだ程度の友人。弥千代の突飛な言動を面白がっていました。
- id: 2513df62-5562-53d3-ba34-9595553918b0
  key: relationship_037
  source: {ref: character_023}
  target: {ref: character_037}
  label: 友人
  period: {ref: temporal_node_010}
  description: 同じ講義をいくつか受けていた学生。弥千代の旅の武勇伝には感心するものの、深く関わることはありませんでした。
- id: c128d578-9891-50d6-a646-dbf21cc2e2ac
  key: relationship_038
  source: {ref: character_023}
  target: {ref: character_038}
  label: 彼氏（1人目）
  period: {ref: temporal_node_010}
  description: 弥千代の突飛な発言にも笑顔で相槌を打つため、弥千代は「理解者だ」と錯覚しましたが、実際は自分の意見がなく、何事も弥千代任せ。彼の主体性のなさに弥千代が痺れを切らし、わずか数ヶ月で別れました。
- id: 50e4d9e5-c70d-5238-a3b0-b5644075b78c
  key: relationship_039
  source: {ref: character_023}
  target: {ref: character_039}
  label: 彼氏（2人目）
  period: {ref: temporal_node_010}
  description: その見た目と口の達者さに弥千代が惹かれて交際。しかし、複数女性との関係や約束破りが発覚し、弥千代が激怒してすぐに別れました。こちらは1ヶ月も続かない関係でした。弥千代の\*\*「恋愛下手」で「男前」に弱い\*\*という一面を象徴する経験でした。
- id: 78403411-66c7-5d85-87d7-cac77a4910af
  key: relationship_040
  source: {ref: character_023}
  target: {ref: character_040}
  label: 嫌いな人物
  period: {ref: temporal_node_011}
  description: 弥千代の直属の上司。弥千代の斬新な企画を「お嬢ちゃんの遊び」と一蹴するなど、彼女の才能を潰そうとした張本人であり、弥千代が最も嫌悪し、テレビ局を辞める大きな要因となりました。
- id: c90e9655-8fb8-57eb-a409-f3b4ce670575
  key: relationship_041
  source: {ref: character_023}
  target: {ref: character_041}
  label: 良き友人
  period: {ref: temporal_node_011}
  description: 弥千代と同い年の報道局同期。テレビ局の理不尽な体質に疑問を感じていました。弥千代の突飛な行動にも理解を示し、時には密かに手助けをすることも。弥千代がVチューバーへの転身を考え始めた時、唯一理解を示し、退職後も陰ながら応援し続ける**唯一無二の存在**です。
- id: 2d61635b-c7b9-57f5-b8e1-4cd807c8240c
  key: relationship_042
  source: {ref: character_023}
  target: {ref: character_042}
  label: 当時付き合っていた人物
  period: {ref: temporal_node_011}
  description: 弥千代の仕事の愚痴は聞くものの、彼女が「会社を辞めたい」と言い出した際には全く理解を示さず、反対しました。弥千代がテレビ局を退職する際に彼の反対を押し切ったことで関係は破綻。この決別が、弥千代の独立への覚悟をさらに強固なものとしました。弥千代が東海道中膝栗毛に登場する弥次郎兵衛の子孫であるという話を聞いて、「そんな架空の人物の子孫のわけがないでしょ？」とクールに返し、興味さえも示しませんでした。
- id: 03ebee6e-3c51-583a-9a0b-f0f8d64cda66
  key: relationship_043
  source: {ref: character_023}
  target: {ref: character_001}
  label: 旅の相棒（後に）
  period: {ref: temporal_node_012}
  description: 城崎温泉で、無理な格好で自撮りをしようとして、危うく、橋から落ちかけるが、そのまま、スマホとカメラは川に落ちて使えなくなる。周囲の人々は心配そうに見守ったり、冷ややかに見ていたり、爆笑していたり…このとき、偶然にも、同じように、隣の橋で無理な姿勢で自撮りをしようとしていて、同じ用に川に落ちかえていた加藤喜一と目が合って、二人は話をすることに。そこで、名刺を交換をして、名前を見た瞬間に、思わず「キタさん…？」と呟いたところから「明治の弥次喜多道中」の物語はスタートする。
  form_of_address: キタさん
