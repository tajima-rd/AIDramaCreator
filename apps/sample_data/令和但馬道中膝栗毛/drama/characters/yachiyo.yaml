  reading: ねぎし つよし
  age: 50代前半
  characteristics:
  - item: 人物像
    description: 男性体育教師。「気合と根性」を重んじ、性別による固定観念に基づく指導を行う、典型的な「昭和気質」の人物。
- id: 064a1b4e-b7e0-53b2-ba11-e7f7dbb2a00c
  key: character_031
  name: 桜井 涼介
  reading: さくらい りょうすけ
  age: 33歳
  characteristics:
  - item: 人物像
    description: 優等生で、生徒会長を務める陸上部のエース。現在は33歳の研修医として多忙な日々を送っています。
- id: 451030dd-e27f-5043-9e8b-f575fbe73a83
  key: character_032
