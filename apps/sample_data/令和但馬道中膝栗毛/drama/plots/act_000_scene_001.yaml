dramaturgy:
  acts:
  - id: 8f66368b-129a-5c59-b0dd-078c5cb9b63b
    key: act_001
    scenes:
    - id: e361e037-6ac6-5880-b596-daf9d7b81a60
      key: scene_002
      order: 1
      synopsis: |-
        熱弁を終えた弥千代に促され、2人は宿の前から坂を下り始める。
        道がきれいに除雪されているのを見た喜一は、「新雪に足をとられる物理的リスクは極めて低い。
        これなら歩行速度を落とさずに移動できる」と論理的に分析する。
        しかし、その直後に足元を大きく滑らせてへっぴり腰になる。
        さらに、そこから体勢を立て直そうとするが、そのまま、尻もちをついていまう。
        道は除雪されているものの、普通の運動靴を履いてきてしまったため凍結に足元をすくわれた形である。
        弥千代はすかさずVlogカメラを回してその様子を爆笑しながら撮影し、プライドを刺激された喜一はカメラを今すぐ消すよう冷淡に要求する。
