  locations: [{ref: location_001}, {ref: location_002}, {ref: location_003}, {ref: location_004}, {ref: location_005}, {ref: location_006}, {ref: location_007}, {ref: location_008}, {ref: location_009}, {ref: location_010}, {ref: location_011}]
  site_flows: [{ref: site_flow_001}, {ref: site_flow_002}, {ref: site_flow_003}, {ref: site_flow_004}, {ref: site_flow_005}, {ref: site_flow_006}, {ref: site_flow_007}]
  proposal:
    title: ハチ北 Locatone スキーガイド（仮）
    catchphrase: スキー場をスムーズに案内し、家族に父としてのカッコよさをアピールしよう
    logline: |-
      はじめての、ハチ北スキー場。家族と一緒に楽しむために来たものの。。。
      思ったよりも、複雑なゲレンデ構造にビックリ。。。
      そんな、父の焦りの前に現れたのは、ハチ北スキー場の音声コンセルジュの「西谷」！！
      果たして、「西谷」の力を借りて、父は安全かつ楽しいスキー体験ができるのであろうか！？
    intent: |-
      ハチ北スキー場は最初に到着するエリアが宿屋エリアとメインゲレンデエリアに分かれる。
      初めてハチ北スキー場を訪れたスキー客の中にはスキー場で迷子になり、
      最終的に元の場所に戻ることができないという課題がある。
      Locatone は スマートフォンのGPSと組み合わせることで、
      各地点に入ると音声情報を再生することができるため、
      スマートフォンや紙媒体の案内などを見ずに適切な情報を得ることができる。
      この企画では敏腕のスキー場コンセルジュの「西谷」が登場し、
      各エリアごとで、スキー場の楽しみ方を音声で案内する。
      特に、今回は家族連れのファミリー層を対象とし、
      スキー客の安全の確保に加えて、「かっこよいお父さん」の演出もサポートする。
    target_area: ハチ北スキー場
    synopsis: |-
      十分に下調べをせずに訪れたスキーのファミリー客の一行。
      思ったよりも、広いことに驚いた家族の長。
      妻と子供の前で格好良い姿を見せたいものの、
      このスキー場に潜む様々な注意事項に気づいていない。
      子どもたちはすぐにでもスキーをしたいとはしゃぎ、
      妻は昼食や帰りの時間などを気にしている。
      そんなときに、現れたのがハチ北を知り尽くす
      ハチ北スキー場の名コンセルジュ「西谷」！！
      一家は、西谷のアドバイスを聞きながら、
      順番にゲレンデを移動しつつ、
      ハチ北スキー場だけでなく、但馬地域の魅力にも触れるのであった。
    characters:
      - name: 西谷
        description: ハチ北スキー場の名コンセルジュ
