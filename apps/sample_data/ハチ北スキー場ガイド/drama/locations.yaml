  instruction: リフトAを使って降りるように案内。16:00 くらいを目標に降りるようにしましょう。
- id: 484d1f79-2c94-57d0-9356-e43b423d4501
  key: location_007
  name: 間違いポイント
  geometry: POLYGON ((134.549735 35.406478, 134.549746 35.406098, 134.550357 35.406076, 134.550438 35.406395, 134.550121 35.406514, 134.549735 35.406478))
  instruction: 旅館街からの人は、今乗ってきたリフトの場所を確認するように促す。周囲の風景を確認し、この場所からしか帰れないことを家族と確認する。スキー初心者は、右側の緩斜面に進むことを勧める。特に、右側ほど緩やかで、真ん中になるとやや急になる。この斜面に慣れたら、この先の正面の野間ゲレンデに進むことを勧める。子供をスキースクールに入れたいのであれば左側の建物、スノボスクールに入れたいのであれば、野間ゲレンデに向かう。スキースクールの横の建物がゲレンデコンビニ。トイレや授乳室などもある。
- id: 64f11e2f-cd98-53fd-9de7-f88a0ae156d0
  key: location_008
  name: 間違いポイント
  geometry: POLYGON ((134.545926 35.407156, 134.54606 35.40685, 134.546634 35.407043, 134.546323 35.407371, 134.545926 35.407156))
  instruction: 旅館街の人は注意。15:30ごろであれば、帰り道を確認させる。このまま、まっすぐに降りてしまうと、時間によってはリフトAに戻れなくなる可能性がある。
- id: cb1f986d-0212-53c8-99d2-1f1d3a33f807
  key: location_009
  name: 最初の場所
  geometry: POLYGON ((134.557827 35.404279, 134.558241 35.404658, 134.557769 35.404913, 134.55755 35.404752, 134.557261 35.404498, 134.557827 35.404279))
  instruction: ハチ北スキー場に関する一般的な説明をする。スキー場の入口となる場所はここ以外にもう一箇所ある。間違って、もう一方の入口からは旅館街に戻ってこれないことがあるので、リフトの名前をきちんと確認することを伝える。
