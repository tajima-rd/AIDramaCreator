# plot_003.txt(apps/sample_project/plot)から変換したプロット(シーンのあらすじ)
dramaturgy:
  acts:
  - key: act1
    scenes:
    - key: plot_003
      order: 2
      synopsis: "坂を下りきり、「ハチ北温泉 湯治の郷」の前に差し掛かる。\nここで弥千代は、施設周辺に設置されているランプシェードに目を留める。\nさらにその近くにあるパネルの記述から、これが地元の香住高校の生徒たちによって手作りされたものであることを知る。\n気になった喜一がスマホで香住高校の位置を検索したところ、それがここから遠く離れた海の近くにある学校であること、\nそしてハチ北からその海の近くまでが「矢田川」という一本の大きな河川で結ばれているという地理的事実に気づく。 \nそれを聞いた弥千代は、ランプシェードの素材に流木やシーグラスが使われていることに注目する。\n山から川をつたって海へと流れていったガラスが、高校生の手によって再び山（ハチ北）へと返ってきたというストーリーに対し、\n弥千代は「海と山の繋がり、これこそロマンであり『ジオ』の本質だ」と感動を露わにする。\n喜一が「ジオとは何か」と問いかけたのに対し、弥千代は元テレビ局員としての知見や大学時代のフィールドワーク経験を交え、\n地形や地球の成り立ちが人の暮らしや文化にどう繋がっているかという「山陰海岸ジオパーク」の考え方を喜一に説明する。\n喜一は、再び、スマートフォンの画面に向き合うと、香住までの経路を検索し、車で60分程度であることに気づき、\n海と山が意外に近い距離にあることに興味を持つと、弥千代は嬉しそうに、そうした地形のダイナミズムが日本の良さであると語る。"
