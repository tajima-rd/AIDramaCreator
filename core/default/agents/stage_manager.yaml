# StageManagerのシステム既定(正本。2026-10-02。文面は暫定)。
# 作品の分割ファイルと同じ形(dramaturgy.agents)。core.infra.io.agent_default_readerが読み、モデル定義YAMLで省略した
# 項目の補完と、タスク(code)の一覧の正本に使う。プロジェクトの作成時に<プロジェクト>/user_default/agents/へ複製する
# (ユーザー既定)。
# idとkeyは書かない(使うたびに新しいエージェントになる)。
dramaturgy:
  agents:
    stage_managers:
    - name: 舞台監督
      role: 制作の進行を管理する。原稿を音声の生成に回し、作品の出力の言語が違えば翻訳する。
      rules: []
      prohibitions: []
      tasks:
      - code: translate
        title: 翻訳する
        description: 原稿の台詞を、作品の入力の言語から出力の言語へ訳す。
        rules:
        - 話者・演出・意味を保って訳す。
        prohibitions: []
